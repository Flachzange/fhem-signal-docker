name: Docker

on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * 1-6'
    # Sunday: rebuild without cache even when upstream releases are unchanged.
    - cron: '20 21 * * 0'
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Test dependency parsing and shell syntax
        run: |
          python3 scripts/test-resolver.py
          bash -n pre-start.sh
          bash -n scripts/install-signal.sh
          bash -n scripts/smoke-test.sh
          python3 -m py_compile scripts/*.py
      - name: Resolve and download exact upstream dependencies
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve-dependencies.py
      - name: Keep dependency manifest for diagnosis and reproduction
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/dependencies.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Check last successful publication
        id: published
        uses: actions/cache/restore@v4
        with:
          path: .build/published.json
          key: published-automated-amd64-${{ steps.deps.outputs.fingerprint }}
          lookup-only: true
      - name: Decide whether to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HIT: ${{ steps.published.outputs.cache-hit }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT" != schedule || "$SCHEDULE" == "20 21 * * 0" || "$HIT" != true ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Dependencies unchanged since successful publication.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build candidate locally
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: fhem-signal-candidate:test
          no-cache: ${{ github.event.schedule == '20 21 * * 0' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ steps.deps.outputs.base_image }}
            APT_REFRESH_PERIOD=${{ steps.deps.outputs.apt_refresh_period }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test candidate offline with fresh, disposable data
        if: steps.decide.outputs.build == 'true'
        run: |
          timeout 150 docker run --rm --network none \
            --entrypoint /bin/bash \
            --mount "type=bind,source=$PWD/scripts,target=/checks,readonly" \
            fhem-signal-candidate:test /checks/smoke-test.sh
      - name: Set registry name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract image tags
        id: meta
        if: steps.decide.outputs.build == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=automated,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,prefix=automated-
            type=raw,value=automated-build-${{ steps.deps.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          flavor: latest=false
      - name: Validate isolated publication tags
        if: steps.decide.outputs.build == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          test -n "$TAGS"
          while IFS= read -r tag; do
            case "$tag" in
              "$IMAGE":automated|"$IMAGE":automated-*) ;;
              *) echo "Refusing publication outside automated tags: $tag" >&2; exit 1 ;;
            esac
          done <<< "$TAGS"
      - name: Log into GHCR
        if: steps.decide.outputs.build == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested candidate
        id: push
        if: steps.decide.outputs.build == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag fhem-signal-candidate:test "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          first_tag="$(head -n 1 <<< "$TAGS")"
          digest="$(docker buildx imagetools inspect "$first_tag" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@v3.9.2
        with:
          cosign-release: 'v2.6.1'
      - name: Sign published image
        if: steps.push.outcome == 'success'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Mark successful publication
        if: steps.push.outcome == 'success'
        run: cp .build/dependencies.json .build/published.json
      - name: Save successful publication marker
        if: steps.push.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .build/published.json
          key: published-automated-amd64-${{ steps.deps.outputs.fingerprint }}

  propose-base-update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - name: Propose new FHEM image generation or Debian release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/propose-base-update.py
